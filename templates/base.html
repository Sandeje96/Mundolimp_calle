<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a56db">
  <meta name="description" content="Control de visitas y ventas en calle — MUNDOLIMP">
  <title>{% block title %}MUNDOLIMP{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}

  <header class="app-header">
    <h1 class="app-title">{% block page_title %}MUNDOLIMP{% endblock %}</h1>
    <div class="header-acciones">
      {% block header_extra %}{% endblock %}
      <a href="/ajustes" class="btn-ajustes" id="btn-ir-ajustes" aria-label="Ajustes">⚙️</a>
    </div>
  </header>

  <main class="app-main">
    {% block content %}{% endblock %}
  </main>

  {% endblock %}

  <!-- Barra de navegación inferior — 5 íconos, apta para el pulgar -->
  <nav class="nav-bottom" role="navigation" aria-label="Navegación principal">
    <a href="/"        class="nav-item {% if request.url.path == '/' %}nav-item--active{% endif %}" id="nav-hoy">
      <span class="nav-icon">📋</span>
      <span class="nav-label">Hoy</span>
    </a>
    <a href="/cierre"  class="nav-item {% if request.url.path == '/cierre' %}nav-item--active{% endif %}" id="nav-cierre">
      <span class="nav-icon">🧾</span>
      <span class="nav-label">Cierre</span>
    </a>
    <a href="/agenda"  class="nav-item {% if request.url.path == '/agenda' %}nav-item--active{% endif %}" id="nav-agenda">
      <span class="nav-icon">📅</span>
      <span class="nav-label">Agenda</span>
    </a>
    <a href="/clientes" class="nav-item {% if request.url.path.startswith('/clientes') %}nav-item--active{% endif %}" id="nav-clientes">
      <span class="nav-icon">👥</span>
      <span class="nav-label">Clientes</span>
    </a>
    <a href="/resumen" class="nav-item {% if request.url.path == '/resumen' %}nav-item--active{% endif %}" id="nav-resumen">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Resumen</span>
    </a>
  </nav>

  <!-- HTMX desde archivo local (no depende del CDN en producción) -->
  <script src="/static/htmx.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
