<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso — MUNDOLIMP</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="body-login">
  <main class="login-wrap">
    <div class="login-card">
      <h1 class="login-titulo">🧴 MUNDOLIMP</h1>
      <p class="login-subtitulo">Control de visitas en calle</p>

      {% if error %}
      <div class="aviso-error" role="alert">❌ PIN incorrecto. Intentá de nuevo.</div>
      {% endif %}

      <form method="post" action="/login" id="form-login">
        <label for="pin" class="sr-only">PIN de acceso</label>
        <input
          type="password"
          id="pin"
          name="pin"
          class="input input--login"
          placeholder="PIN de acceso"
          inputmode="numeric"
          autocomplete="current-password"
          autofocus
          required
        >
        <button type="submit" class="btn btn-primario btn-login" id="btn-entrar">
          Entrar →
        </button>
      </form>
    </div>
  </main>
</body>
</html>
